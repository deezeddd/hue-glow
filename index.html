<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hue Glow</title>
<meta name="description" content="A colour picker that glows. Drag for hue, saturation and lightness, read the name, tap to copy.">
<meta property="og:title" content="Hue Glow">
<meta property="og:description" content="A colour picker that glows. Drag for hue, saturation and lightness, read the name, tap to copy.">
<meta name="theme-color" content="#131418">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23131418'/%3E%3Cellipse cx='32' cy='60' rx='34' ry='26' fill='%234d5dff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;800&display=swap">
<style>
/* Layout: the whole screen is one glow card. Name and values top left. Hue and saturation bars pinned to the
   bottom, a lightness bar standing at the right. Drag anywhere to move hue and lightness together. */
:root {
  --card: #131418;
  --ink: #f6f1e8;
  --muted: #9ea0ad;
  --hairline: rgba(255,255,255,.1);
  --c: hsl(240 100% 50%);
  --tint: hsl(240 100% 74%);
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --gutter: max(24px, env(safe-area-inset-left, 0px));
  --gutter-r: max(24px, env(safe-area-inset-right, 0px));
  --bottom: max(24px, env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--card); color: var(--ink); font-family: var(--display); font-size: 16px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
}
.stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.stage.dragging { cursor: grabbing; }
.glow {
  position: absolute; inset: -10%; pointer-events: none;
  background:
    radial-gradient(45% 30% at 50% 105%, rgba(255,255,255,.8), transparent 70%),
    radial-gradient(80% 60% at 50% 100%, var(--c), transparent 72%),
    linear-gradient(to bottom, transparent 30%, color-mix(in srgb, var(--c) 30%, transparent) 65%, color-mix(in srgb, var(--c) 85%, transparent));
  filter: blur(28px);
}
.content {
  position: absolute; left: 0; right: 0; top: 0;
  padding: max(28px, env(safe-area-inset-top, 0px)) var(--gutter-r) 0 var(--gutter);
  display: grid; gap: 14px; justify-items: start;
}
.eyebrow { font-weight: 500; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 {
  margin: 0; font-weight: 800; text-transform: uppercase; line-height: .92; letter-spacing: .005em;
  font-size: clamp(52px, 12vw, 150px); text-wrap: balance; max-width: 92vw;
}
.values { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 0; cursor: pointer; font: 500 17px var(--display); letter-spacing: .04em; text-transform: uppercase; font-variant-numeric: tabular-nums;
  padding: 7px 12px 6px; border-radius: 8px; color: var(--tint); background: color-mix(in srgb, var(--c) 20%, rgba(0,0,0,.35));
  display: inline-flex; align-items: baseline; gap: 8px; transition: transform .1s ease; line-height: 1.2;
}
.chip:active { transform: scale(.96); }
.chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.chip.hex { font-weight: 800; font-size: 22px; padding: 7px 14px 6px; }
.toast {
  position: absolute; left: 50%; transform: translateX(-50%); top: max(16px, env(safe-area-inset-top, 0px));
  font-weight: 500; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
  padding: 8px 14px; border-radius: 8px; background: rgba(0,0,0,.55); color: var(--ink); border: 1px solid var(--hairline);
  opacity: 0; transition: opacity .18s ease; pointer-events: none;
}
.toast.show { opacity: 1; }
.meta {
  position: absolute; left: var(--gutter); right: calc(var(--gutter-r) + 52px); bottom: calc(var(--bottom) + 104px);
  display: flex; justify-content: space-between; gap: 16px; align-items: baseline;
  font-weight: 500; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: rgba(246,241,232,.5);
}
.meta .foot { margin: 0; }
.meta .hint { margin: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Bars: dark glass tracks, a soft fill in the colour up to the knob, a knob that glows. */
.bar { position: absolute; cursor: grab; touch-action: none; }
.bar:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; border-radius: 10px; }
.track { position: absolute; inset: 0; border-radius: 10px; background: rgba(10,11,14,.55); border: 1px solid var(--hairline); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.tag { position: absolute; font-weight: 500; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgba(246,241,232,.45); pointer-events: none; }
.fill { position: absolute; border-radius: 7px; pointer-events: none; }
.knob {
  position: absolute; width: 24px; height: 24px; border-radius: 7px; background: var(--c); border: 2px solid var(--ink);
  box-shadow: 0 2px 10px rgba(0,0,0,.5), 0 0 22px var(--c); transition: box-shadow .15s ease; pointer-events: none;
}
.bar.dragging .knob { box-shadow: 0 2px 10px rgba(0,0,0,.5), 0 0 36px var(--c), 0 0 60px color-mix(in srgb, var(--c) 60%, transparent); }

.bar.h { left: var(--gutter); right: calc(var(--gutter-r) + 52px); bottom: var(--bottom); height: 36px; }
.bar.h .tag { left: 14px; top: 11px; }
.bar.h .fill { left: 4px; top: 4px; height: 28px; background: linear-gradient(to right, transparent, color-mix(in srgb, var(--c) 55%, transparent)); }
.bar.h .knob { top: 6px; transform: translateX(-50%); }

.bar.s { left: var(--gutter); right: calc(var(--gutter-r) + 52px); bottom: calc(var(--bottom) + 48px); height: 36px; }
.bar.s .tag { left: 14px; top: 11px; }
.bar.s .fill { left: 4px; top: 4px; height: 28px; background: linear-gradient(to right, rgba(158,160,173,.25), color-mix(in srgb, var(--c) 55%, transparent)); }
.bar.s .knob { top: 6px; transform: translateX(-50%); }

.bar.l { right: var(--gutter-r); bottom: var(--bottom); width: 36px; height: min(44vh, 320px); }
.bar.l .tag { left: 50%; top: 12px; transform: translateX(-50%) rotate(90deg); transform-origin: center; white-space: nowrap; }
.bar.l .fill { left: 4px; right: 4px; bottom: 4px; background: linear-gradient(to top, transparent, rgba(246,241,232,.55)); }
.bar.l .knob { left: 6px; transform: translateY(50%); }

@media (max-width: 520px) {
  .meta .foot { display: none; }
  .chip.hex { font-size: 20px; } .chip { font-size: 16px; }
  .bar.l { height: 36vh; }
}
@media (prefers-reduced-motion: reduce) { .chip, .knob, .toast { transition: none; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="glow"></div>
  <div class="content">
    <p class="eyebrow">Hue Glow</p>
    <h1 id="name">Blue</h1>
    <div class="values">
      <button class="chip hex" id="hex" type="button" aria-label="Copy hex">#0000FF</button>
      <button class="chip" id="rgb" type="button" aria-label="Copy RGB">rgb(0, 0, 255)</button>
      <button class="chip" id="hsl" type="button" aria-label="Copy HSL">hsl(240, 100%, 50%)</button>
      <button class="chip" id="link" type="button" aria-label="Copy link to this colour">link</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite">Copied</div>
  <div class="meta">
    <p class="foot">Drag anywhere: across for hue, up and down for light. Arrow keys nudge, shift for ten.</p>
    <p class="hint" id="hint">240° · Blue</p>
  </div>
  <div class="bar s" id="sbar" role="slider" aria-label="Saturation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" tabindex="0">
    <div class="track"></div><div class="fill" id="sfill"></div><span class="tag">Sat</span><div class="knob" id="sknob"></div>
  </div>
  <div class="bar h" id="hbar" role="slider" aria-label="Hue" aria-valuemin="0" aria-valuemax="359" aria-valuenow="240" tabindex="0">
    <div class="track"></div><div class="fill" id="hfill"></div><span class="tag">Hue</span><div class="knob" id="hknob"></div>
  </div>
  <div class="bar l" id="lbar" role="slider" aria-label="Lightness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" tabindex="0">
    <div class="track"></div><div class="fill" id="lfill"></div><span class="tag">Light</span><div class="knob" id="lknob"></div>
  </div>
</div>
<script src="names.js"></script>
<script>
(function () {
  // ---- colour maths ----
  function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2, r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
    return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
  }
  function hexOf(rgb) { return "#" + rgb.map(function (v) { return ("0" + v.toString(16).toUpperCase()).slice(-2); }).join(""); }
  function lab(r, g, b) {
    function lin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    r = lin(r); g = lin(g); b = lin(b);
    var x = (r * 0.4124 + g * 0.3576 + b * 0.1805) / 0.95047, y = r * 0.2126 + g * 0.7152 + b * 0.0722, z = (r * 0.0193 + g * 0.1192 + b * 0.9505) / 1.08883;
    function f(t) { return t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116; }
    var fx = f(x), fy = f(y), fz = f(z);
    return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
  }
  var families = [[10,"Red"],[20,"Vermilion"],[35,"Orange"],[48,"Amber"],[65,"Yellow"],[80,"Lime"],[140,"Green"],[165,"Mint"],[175,"Teal"],[195,"Cyan"],[215,"Sky"],[235,"Azure"],[250,"Blue"],[265,"Indigo"],[285,"Violet"],[300,"Purple"],[320,"Magenta"],[340,"Pink"],[354,"Rose"],[360,"Red"]];
  function family(h, s, l) {
    if (l < 8) return "Black"; if (l > 94) return "White"; if (s < 10) return "Grey";
    for (var i = 0; i < families.length; i++) if (h <= families[i][0]) return families[i][1];
    return "Red";
  }

  // ---- names: 5,000 embedded, the full 32,000 list loaded quietly afterwards ----
  var names = [], labs = [];
  function loadNames(list) {
    names = new Array(list.length); labs = new Float32Array(list.length * 3);
    for (var i = 0; i < list.length; i++) {
      var hx = list[i][1], L = lab(parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16));
      names[i] = list[i][0]; labs[i * 3] = L[0]; labs[i * 3 + 1] = L[1]; labs[i * 3 + 2] = L[2];
    }
  }
  loadNames(window.HUE_GLOW_NAMES || []);
  setTimeout(function () {
    fetch("https://cdn.jsdelivr.net/npm/color-name-list@14.80.0/dist/colornames.json").then(function (r) { return r.json(); }).then(function (full) {
      loadNames(full.map(function (c) { return [c.name, c.hex.slice(1).toUpperCase()]; }));
      paint();
    }).catch(function () {});
  }, 1500);
  function nearest(rgb) {
    var L = lab(rgb[0], rgb[1], rgb[2]), best = -1, bd = Infinity;
    for (var i = 0, n = names.length; i < n; i++) {
      var dl = labs[i * 3] - L[0], da = labs[i * 3 + 1] - L[1], db = labs[i * 3 + 2] - L[2], d = dl * dl + da * da + db * db;
      if (d < bd) { bd = d; best = i; }
    }
    return best >= 0 ? names[best] : "";
  }

  // ---- state and paint ----
  var root = document.documentElement, stage = document.getElementById("stage");
  var hbar = document.getElementById("hbar"), sbar = document.getElementById("sbar"), lbar = document.getElementById("lbar");
  var hknob = document.getElementById("hknob"), sknob = document.getElementById("sknob"), lknob = document.getElementById("lknob");
  var hfill = document.getElementById("hfill"), sfill = document.getElementById("sfill"), lfill = document.getElementById("lfill");
  var nameEl = document.getElementById("name"), hexEl = document.getElementById("hex"), rgbEl = document.getElementById("rgb"), hslEl = document.getElementById("hsl");
  var hint = document.getElementById("hint"), toast = document.getElementById("toast");
  var H = 240, S = 100, Lt = 50, hexText = "", rgbText = "", hslText = "";
  var clamp = function (v, a, b) { return Math.min(Math.max(v, a), b); };

  function paint() {
    H = ((Math.round(H) % 360) + 360) % 360; S = clamp(Math.round(S), 0, 100); Lt = clamp(Math.round(Lt), 0, 100);
    var rgb = hslToRgb(H, S, Lt);
    hexText = hexOf(rgb); rgbText = "rgb(" + rgb.join(", ") + ")"; hslText = "hsl(" + H + ", " + S + "%, " + Lt + "%)";
    root.style.setProperty("--c", "hsl(" + H + " " + S + "% " + Lt + "%)");
    root.style.setProperty("--tint", "hsl(" + H + " " + Math.max(S, 35) + "% " + clamp(Lt + 24, 62, 86) + "%)");
    var exact = nearest(rgb) || family(H, S, Lt);
    nameEl.textContent = exact;
    hexEl.textContent = hexText; rgbEl.textContent = rgbText; hslEl.textContent = hslText;
    hint.textContent = H + "° · " + S + "% · " + Lt + "% · " + family(H, S, Lt);
    var hx = 14 + H / 359 * (hbar.clientWidth - 28); hknob.style.left = hx + "px"; hfill.style.width = Math.max(0, hx - 8) + "px";
    var sx = 14 + S / 100 * (sbar.clientWidth - 28); sknob.style.left = sx + "px"; sfill.style.width = Math.max(0, sx - 8) + "px";
    var ly = 14 + Lt / 100 * (lbar.clientHeight - 28); lknob.style.bottom = ly + "px"; lfill.style.height = Math.max(0, ly - 8) + "px";
    hbar.setAttribute("aria-valuenow", H); sbar.setAttribute("aria-valuenow", S); lbar.setAttribute("aria-valuenow", Lt);
    document.title = exact + " " + hexText + " · Hue Glow";
    try { history.replaceState(null, "", "#h" + H + "s" + S + "l" + Lt); } catch (e) {}
  }

  // ---- dragging: bars are absolute, the stage is relative so a touch never jumps the colour ----
  var mode = null, last = null;
  function barValue(bar, e) {
    var r = bar.getBoundingClientRect();
    if (bar === lbar) return clamp((r.bottom - e.clientY - 14) / (r.height - 28), 0, 1);
    return clamp((e.clientX - r.left - 14) / (r.width - 28), 0, 1);
  }
  function apply(e) {
    if (mode === "h") H = barValue(hbar, e) * 359;
    else if (mode === "s") S = barValue(sbar, e) * 100;
    else if (mode === "l") Lt = barValue(lbar, e) * 100;
    else if (mode === "pad" && last) {
      H += (e.clientX - last.x) / stage.clientWidth * 360;
      Lt -= (e.clientY - last.y) / stage.clientHeight * 100;
    }
    last = { x: e.clientX, y: e.clientY };
    paint();
  }
  stage.addEventListener("pointerdown", function (e) {
    if (e.target.closest(".chip")) return;
    var bar = e.target.closest(".bar");
    mode = bar ? bar.id[0] : "pad"; last = { x: e.clientX, y: e.clientY };
    stage.setPointerCapture(e.pointerId); stage.classList.add("dragging");
    if (bar) { bar.classList.add("dragging"); apply(e); }
  });
  stage.addEventListener("pointermove", function (e) { if (mode) apply(e); });
  function end() { mode = null; last = null; stage.classList.remove("dragging"); [hbar, sbar, lbar].forEach(function (b) { b.classList.remove("dragging"); }); }
  stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);

  function keys(e) {
    var step = e.shiftKey ? 10 : 1, t = document.activeElement, k = e.key;
    if (t === sbar && (k === "ArrowLeft" || k === "ArrowRight")) S += k === "ArrowRight" ? step : -step;
    else if (t === lbar && (k === "ArrowUp" || k === "ArrowDown")) Lt += k === "ArrowUp" ? step : -step;
    else if (k === "ArrowLeft") H -= step; else if (k === "ArrowRight") H += step;
    else if (k === "ArrowUp") Lt += step; else if (k === "ArrowDown") Lt -= step;
    else return;
    e.preventDefault(); paint();
  }
  document.addEventListener("keydown", function (e) { if (!e.target.closest(".chip")) keys(e); });
  window.addEventListener("resize", paint);

  // ---- copy ----
  var toastTimer;
  function copy(text, label) {
    var done = function () {
      toast.textContent = "Copied " + label; toast.classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1400);
    };
    var fallback = function () {
      var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {} finally { document.body.removeChild(ta); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }
  hexEl.addEventListener("click", function () { copy(hexText, hexText); });
  rgbEl.addEventListener("click", function () { copy(rgbText, "RGB"); });
  hslEl.addEventListener("click", function () { copy(hslText, "HSL"); });
  document.getElementById("link").addEventListener("click", function () { copy(location.href.split("#")[0] + "#h" + H + "s" + S + "l" + Lt, "link"); });

  // ---- start from the link ----
  var m = /^#h(\d{1,3})(?:s(\d{1,3}))?(?:l(\d{1,3}))?$/.exec(location.hash || "");
  if (m) { H = +m[1]; if (m[2] != null) S = +m[2]; if (m[3] != null) Lt = +m[3]; }
  paint();
})();
</script>
</body>
</html>
